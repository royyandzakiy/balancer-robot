# Logging
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# C++
CONFIG_CPP=y
CONFIG_STD_CPP2B=y
CONFIG_GLIBCXX_LIBCPP=y

CONFIG_MAIN_STACK_SIZE=2048

# GPIO emulator, drives the button from test_harness.c
CONFIG_GPIO_EMUL=y
CONFIG_GPIO=y

# Shell for the test_btn command
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
# No color escape codes, so pytest matches plain text
CONFIG_SHELL_VT100_COLORS=n
