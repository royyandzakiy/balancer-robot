; qmlformat settings (Qt 6.5+ reads this from the .qml file's directory or any parent).
; Used by the `format` / `format-check` targets (cmake/qml_tools.cmake), Qt Creator and the Qt VS Code
; extension, so QML looks the same whatever the editor. Mirrors the [*.qml] section of .editorconfig.
[General]
IndentWidth=4
UseTabs=false
NewlineType=unix
NormalizeOrder=false
ObjectsSpacing=false
FunctionsSpacing=false
